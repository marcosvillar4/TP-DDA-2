<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo}}</title>
</head>
<body style="margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#243447;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="background:#f3f6fa;padding:32px 16px;">
    <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;
                      box-shadow:0 3px 12px rgba(31,45,61,.12);">
            <tr>
                <td style="background:#1769aa;padding:28px 32px;color:#ffffff;">
                    <div style="font-size:20px;font-weight:700;">
                        <span style="color:#ffffff;">Logi</span><span style="color:#D6273C;">Red</span>
                    </div>
                    <h1 style="margin:14px 0 0;font-size:25px;line-height:1.25;">{{titulo}}</h1>
                </td>
            </tr>
            <tr>
                <td style="padding:32px;">
                    <p style="margin:0 0 20px;font-size:16px;line-height:1.7;">
                        Tenés un nuevo pedido para gestionar.
                    </p>
                    <div style="padding:18px 20px;background:#eef6fc;border-left:4px solid #1769aa;
                                color:#36536b;font-size:15px;line-height:1.8;white-space:pre-line;">
                        {{mensaje}}
                    </div>
                    <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#718096;">
                        Desde tu perfil podés retirar el pedido, iniciar el viaje y confirmar la entrega.
                    </p>
                </td>
            </tr>
            <tr>
                <td style="padding:20px 32px;background:#f8fafc;color:#718096;font-size:12px;text-align:center;">
                    Este mensaje fue generado automáticamente por LogiRed. No respondas a este correo.
                </td>
            </tr>
        </table>
    </td></tr>
</table>
</body>
</html>
