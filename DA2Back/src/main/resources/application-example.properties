spring.application.name=DA2Back
spring.datasource.url=jdbc:mysql://localhost:3306/marketplace
spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.datasource.username= 
spring.datasource.password= 
spring.jpa.hibernate.ddl-auto= update
jwt.secret=MiSuperClaveSecreta123456789012345678901234567890
jwt.expiration=3600000 

# Credenciales del admin que se crea automáticamente al arrancar la app
admin.seed.username=admin
admin.seed.email=admin@da2back.com
admin.seed.password=CambiarEstaClave123

# ---------------------------------------------------------------------------
# Mensajeria asincronica (ActiveMQ, cola punto a punto)
# ---------------------------------------------------------------------------
# Habilita productor/consumidor de pedidos listos para retirar.
app.mensajeria.habilitada=true
# true  -> la app levanta un ActiveMQ embebido en tcp://localhost:61616 (sin instalar nada).
# false -> se usa un ActiveMQ instalado aparte (bin/activemq start).
app.mensajeria.broker-embebido=true
app.mensajeria.broker-url-escucha=tcp://localhost:61616
# Cola donde se publica cada pedido LISTO_PARA_RETIRAR.
app.mensajeria.cola-pedidos-listos=logired.pedidos.listos
# Conexion al broker + politica de reintentos: 10 reentregas, una cada 2 s; luego va a ActiveMQ.DLQ.
spring.activemq.broker-url=tcp://localhost:61616?jms.redeliveryPolicy.maximumRedeliveries=10&jms.redeliveryPolicy.initialRedeliveryDelay=2000&jms.redeliveryPolicy.redeliveryDelay=2000
