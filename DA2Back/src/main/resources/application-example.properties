server.port=${SERVER_PORT:8081}

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-to-a-value-of-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Gmail SMTP. Usar una contraseña de aplicación, no la contraseña normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:30000}

# Semillas
admin.seed.username=admin
admin.seed.email=admin@da2back.com
admin.seed.password=admin123

# ---------------------------------------------------------------------------
# Mensajeria asincronica (ActiveMQ, cola punto a punto)
# ---------------------------------------------------------------------------
# Habilita productor/consumidor de pedidos listos para retirar.
app.mensajeria.habilitada=true
# true  -> la app levanta un ActiveMQ embebido en tcp://localhost:61616 (sin instalar nada).
# false -> se usa un ActiveMQ instalado aparte (bin/activemq start).
app.mensajeria.broker-embebido=true
app.mensajeria.broker-url-escucha=tcp://localhost:61616
# Cola donde se publica cada pedido LISTO_PARA_RETIRAR.
app.mensajeria.cola-pedidos-listos=logired.pedidos.listos
# Conexion al broker + politica de reintentos: 10 reentregas, una cada 2 s; luego va a ActiveMQ.DLQ.
spring.activemq.broker-url=tcp://localhost:61616?jms.redeliveryPolicy.maximumRedeliveries=10&jms.redeliveryPolicy.initialRedeliveryDelay=2000&jms.redeliveryPolicy.redeliveryDelay=2000
