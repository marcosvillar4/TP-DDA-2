server.port=8081

# Base de datos H2 en memoria para desarrollo local sin MySQL
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=${JWT_SECRET:MiClaveSecretaDeAlMenos32Caracteres}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Gmail SMTP. Usar una contraseña de aplicación, no la contraseña normal.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:5000}

# Semillas
admin.seed.username=admin
admin.seed.email=admin@da2back.com
admin.seed.password=admin123
