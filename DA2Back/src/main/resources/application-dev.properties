# ---------------------------------------------------------------------------
# Mapas, cotizacion y ruteo
# ---------------------------------------------------------------------------
# osm    -> GRATIS y sin API key: Nominatim (geocodificacion) + OSRM (ruteo). Por defecto.
# google -> Google Maps (Geocoding + Routes API). Requiere app.mapas.google.api-key y facturacion habilitada.
# local  -> sin red: estimacion en linea recta (Haversine). Usado en los tests.
app.mapas.proveedor=${MAPAS_PROVEEDOR:osm}
app.mapas.google.api-key=${GOOGLE_MAPS_API_KEY:}
app.mapas.pais=ar
app.mapas.timeout-ms=4000
# Politica de uso de OSM: identificar la aplicacion con un User-Agent propio.
app.mapas.user-agent=LogiRed-TP-DA2/1.0 (proyecto academico)
# Estimacion sin servicio de ruteo: km reales ~ km en linea recta * factor; velocidad urbana promedio.
app.mapas.factor-rodeo=1.3
app.mapas.velocidad-promedio-kmh=25

# Tarifa: total = max(minima, base + km * precio-por-km + objetos * precio-por-objeto)
app.cotizacion.moneda=ARS
app.cotizacion.tarifa-base=1500
app.cotizacion.precio-por-km=450
app.cotizacion.precio-por-objeto=120
app.cotizacion.tarifa-minima=2000
# Distancia que se cotiza cuando no se pudo ubicar alguna de las direcciones.
app.cotizacion.distancia-defecto-km=5

# Semillas
admin.seed.username=admin
admin.seed.email=admin@da2back.com
admin.seed.password=admin123

# ---------------------------------------------------------------------------
# Mensajeria asincronica (ActiveMQ, cola punto a punto)
# ---------------------------------------------------------------------------
# Habilita productor/consumidor de pedidos listos para retirar.
app.mensajeria.habilitada=true
# true  -> la app levanta un ActiveMQ embebido en tcp://localhost:61616 (sin instalar nada).
# false -> se usa un ActiveMQ instalado aparte (bin/activemq start).
app.mensajeria.broker-embebido=true
app.mensajeria.broker-url-escucha=tcp://localhost:61616
# Cola donde se publica cada pedido LISTO_PARA_RETIRAR.
app.mensajeria.cola-pedidos-listos=logired.pedidos.listos
# Conexion al broker + politica de reintentos: 10 reentregas, una cada 2 s; luego va a ActiveMQ.DLQ.
spring.activemq.broker-url=tcp://localhost:61616?jms.redeliveryPolicy.maximumRedeliveries=10&jms.redeliveryPolicy.initialRedeliveryDelay=2000&jms.redeliveryPolicy.redeliveryDelay=2000
