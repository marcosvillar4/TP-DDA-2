server.port=8081

# Base de datos H2 en memoria para desarrollo local sin MySQL
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=MiClaveSecretaDeAlMenos32Caracteres
jwt.expiration=3600000

# Gmail SMTP. Usar una contraseña de aplicación, no la contraseña normal.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=
app.mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:30000}

# Semillas
admin.seed.username=admin
admin.seed.email=admin@da2back.com
admin.seed.password=admin123
